<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏠 House Price Predictor</h1>

        <p class="subtitle">
            AI-powered house price estimation
        </p>
    </div>

    <div class="form-card">

        <form id="predictionForm">

            <div class="grid">

                <div class="field">
                    <label>Bedrooms</label>
                    <input type="number" id="bedrooms" value="3" required>
                </div>

                <div class="field">
                    <label>Bathrooms</label>
                    <input type="number" id="bathrooms" value="2.5" step="0.5" required>
                </div>

                <div class="field">
                    <label>Living Area (sqft)</label>
                    <input type="number" id="sqft_living" value="2000" required>
                </div>

                <div class="field">
                    <label>Lot Area (sqft)</label>
                    <input type="number" id="sqft_lot" value="5000" required>
                </div>

                <div class="field">
                    <label>Floors</label>
                    <input type="number" id="floors" value="1" step="0.5" required>
                </div>

                <div class="field">
                    <label>Waterfront</label>
                    <select id="waterfront">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="field">
                    <label>View</label>
                    <input type="number" id="view" value="0" min="0" max="4" required>
                </div>

                <div class="field">
                    <label>Condition</label>
                    <input type="number" id="condition" value="3" min="1" max="5" required>
                </div>

                <div class="field">
                    <label>Grade</label>
                    <input type="number" id="grade" value="7" min="1" max="13" required>
                </div>

                <div class="field">
                    <label>Above Ground Area (sqft)</label>
                    <input type="number" id="sqft_above" value="1800" required>
                </div>

                <div class="field">
                    <label>Basement Area (sqft)</label>
                    <input type="number" id="sqft_basement" value="200" required>
                </div>

                <div class="field">
                    <label>Year Built</label>
                    <input type="number" id="yr_built" value="1995" required>
                </div>

                <div class="field">
                    <label>Nearby Average Living Area</label>
                    <input type="number" id="sqft_living15" value="1900" required>
                </div>

                <div class="field">
                    <label>Latitude</label>
                    <input type="number" id="lat" value="47.5" step="any" required>
                </div>

                <div class="field">
                    <label>Longitude</label>
                    <input type="number" id="long" value="-122.2" step="any" required>
                </div>

                <div class="field">
                    <label>Zipcode</label>
                    <input type="number" id="zipcode" value="98052" required>
                </div>

            </div>

            <button type="submit">
                Predict House Price
            </button>

        </form>

        <div id="result" class="result hidden">
            <p>Estimated House Price</p>
            <h2 id="price">$0</h2>
        </div>

        <div id="error" class="error hidden"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
